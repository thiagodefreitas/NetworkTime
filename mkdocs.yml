site_name: ntpstats
site_description: "Open-source Python toolkit for NTP and PTP: Allan deviation, TDEV, MTIE and time error from chrony, ntpd, ntpd-rs and linuxptp logs and packet captures, plus a clock-synchronisation test bench."
site_author: "Thiago de Freitas"
site_url: "https://thiagodefreitas.github.io/NetworkTime/"
copyright: "© 2012–2026 Thiago de Freitas · MIT License"
repo_name: thiagodefreitas/NetworkTime
repo_url: https://github.com/thiagodefreitas/NetworkTime
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides  # adds the Search Console verification tag to <head>
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

exclude_docs: |
  *.py
  __pycache__/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI: cli.md
  - In your browser: browser.md
  - Formats: formats.md
  - Statistics: statistics.md
  - Network & estimators: network.md
  - Trace replay & PTP chains: research-bench.md
  - PTP captures & time error: ptp.md
  - Sources, instruments & bounds: sources.md
  - Audit, events & CI checks: assurance.md
  - Monitoring (Prometheus/Grafana): monitoring.md
  - Protocols (Roughtime, NTS pools, RFC 9769): protocols.md
  - Metrology (noise model, hat, holdover): metrology.md
  - Research data (CGGTTS, Circular T, Atlas): research-data.md
  - Dataframes & Parquet: dataframes.md
  - Writing a plugin: plugins.md
  - Notebooks & gallery: notebooks.md
  - Validation: validation.md
  - Stable32, TimeLab, allantools: migrating.md
  - API:
      - Overview: api/index.md
      - Stable API: api/stable.md
      - series: api/series.md
      - parsers: api/parsers.md
      - stability: api/stability.md
      - edf: api/edf.md
      - analysis: api/analysis.md
      - network: api/network.md
      - filters: api/filters.md
      - estimators: api/estimators.md
      - simulate: api/simulate.md
      - bench: api/bench.md
      - trace: api/trace.md
      - ptpsim: api/ptpsim.md
      - simio: api/simio.md
      - sntp: api/sntp.md
      - nts: api/nts.md
      - roughtime: api/roughtime.md
      - spectrum: api/spectrum.md
      - noisefit: api/noisefit.md
      - hat: api/hat.md
      - holdover: api/holdover.md
      - research: api/research.md
      - masks: api/masks.md
      - report: api/report.md
      - ptp: api/ptp.md
      - ubx: api/ubx.md
      - timeerror: api/timeerror.md
      - sources: api/sources.md
      - bounds: api/bounds.md
      - profiles: api/profiles.md
      - audit: api/audit.md
      - events: api/events.md
      - testing: api/testing.md
      - interop: api/interop.md
      - metrics: api/metrics.md
      - otlp: api/otlp.md
      - plugins: api/plugins.md
      - adapters: api/adapters.md
      - compat.allantools: api/compat.md
  - Live interop: INTEROP.md
  - State of the art: STATE_OF_THE_ART.md
  - Tools landscape: LANDSCAPE.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            members_order: source
            filters: ["!^_"]
