# Lines to add to chrony.conf for an ntpstats validation campaign (docs/validation-campaign.md).

# The network sources the host is disciplined by, as in production (keep your own).
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
pool pool.ntp.org iburst

# The independent reference: a GNSS receiver's PPS on /dev/pps0, logged but never selected.
# Without "lock", the second each pulse marks comes from the (network-synchronised) system clock.
refclock PPS /dev/pps0 refid PPS noselect

log tracking measurements refclocks
logdir /var/log/chrony
