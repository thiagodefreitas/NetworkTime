[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntpstats-toy-csv"
version = "0.1.0"
description = "Example ntpstats plugin: a toy CSV dialect, a detector, a mask and a profile"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["ntpstats>=2.14"]

[project.entry-points."ntpstats.parsers"]
toycsv = "ntpstats_toy_csv:PARSER"

[project.entry-points."ntpstats.detectors"]
toy-big-offset = "ntpstats_toy_csv:DETECTOR"

[project.entry-points."ntpstats.masks"]
toy-tdev = "ntpstats_toy_csv:MASK"

[project.entry-points."ntpstats.profiles"]
toy-counter = "ntpstats_toy_csv:PROFILE"
