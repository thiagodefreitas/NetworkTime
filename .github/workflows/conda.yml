name: Conda
# Builds and tests the conda-forge recipe (packaging/conda-forge) from the PyPI release, the way
# conda-forge does, so the recipe submitted to staged-recipes is known to work.
on:
  push:
    paths: ["packaging/conda-forge/**", ".github/workflows/conda.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rattler-build
        run: |
          curl -sSL -o rattler-build https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl
          chmod +x rattler-build
      - name: Build and test the recipe
        run: ./rattler-build build --recipe packaging/conda-forge/recipe.yaml --variant-config packaging/conda-forge/variants.yaml -c conda-forge --output-dir out
