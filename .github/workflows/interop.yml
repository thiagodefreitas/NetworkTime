# Live interoperability check against public NTP / NTS servers.
# Runs weekly and on demand; results are written to the job summary.
# Uses at most a few packets per server (well within pool/NIST etiquette).
name: Live interop
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[nts]"
      - name: NTPv4 / NTS / NTPv5 probes
        run: |
          python docs/interop.py | tee -a "$GITHUB_STEP_SUMMARY"
