name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,plot,nts]" pytest-cov ruff
      - name: Lint
        run: ruff check src tests examples docs
      - name: Tests with coverage
        run: pytest -q --cov=ntpstats --cov-report=term-missing:skip-covered
      - name: CLI smoke test
        run: |
          ntpstats info examples/data/loopstats.2012
          ntpstats stability examples/data/peerstats.example --peer 192.0.2.10
          ntpstats simulate --preset lan --duration 3600 --benchmark
