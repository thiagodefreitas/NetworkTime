name: Paper
# Builds the JOSS paper draft (paper/paper.md) into a PDF with the journal's own toolchain.
on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
