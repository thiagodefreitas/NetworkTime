name: Feature request
description: A statistic, format, source, protocol or UI feature you need
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The task or question, e.g. "check a boundary clock against G.8273.2 class C" or "compare three NTS servers".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Tools, scripts or instruments you use now (Stable32, TimeLab, allantools, vendor software...).
  - type: textarea
    id: references
    attributes:
      label: References
      description: Standards, papers or docs that define what you need.
  - type: dropdown
    id: who
    attributes:
      label: Context
      options: [Operations, "PTP / telecom / TSN", Regulated (finance, energy...), Metrology / time lab, Research, Other]
