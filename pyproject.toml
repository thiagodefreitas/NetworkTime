[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntpstats"
dynamic = ["version"]
description = "NTP / network-time offset, delay and frequency-stability analysis (ADEV, MDEV, TDEV, HDEV, MTIE) with a lightweight web UI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Thiago de Freitas", email = "thiagodefreitas@gmail.com"}]
keywords = ["ntp", "chrony", "ntpsec", "allan deviation", "tdev", "mtie", "time synchronization", "clock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking :: Time Synchronization",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
nts = ["pyOpenSSL>=23.2", "cryptography>=42"]
test = ["pytest>=7", "tomli>=2; python_version < '3.11'"]
toml = ["tomli>=2; python_version < '3.11'"]
docs = ["mkdocs>=1.5,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/thiagodefreitas/NetworkTime"
Issues = "https://github.com/thiagodefreitas/NetworkTime/issues"

[project.scripts]
ntpstats = "ntpstats.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ntpstats.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ntpstats.web" = ["static/*", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["ntpstats"]

[tool.mypy]
# third-party modules without stubs (pyOpenSSL, matplotlib extras); ntpstats itself is checked fully
ignore_missing_imports = true
warn_unused_ignores = true
