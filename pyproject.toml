[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ntpstats"
dynamic = ["version"]
description = "Validate, evaluate and study network time: NTP, NTS, PTP and GNSS logs and captures, frequency stability with confidence intervals, time error, UTC audit, simulation and a lightweight web UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Thiago de Freitas"}]
keywords = ["ntp", "nts", "ptp", "chrony", "ntpsec", "linuxptp", "allan deviation", "tdev", "mtie", "time error", "time synchronization", "clock", "gnss", "roughtime"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking :: Time Synchronization",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
nts = ["pyOpenSSL>=23.2", "cryptography>=42"]
test = ["pytest>=7", "tomli>=2; python_version < '3.11'"]
toml = ["tomli>=2; python_version < '3.11'"]
data = ["pandas>=1.5", "pyarrow>=12", "xarray>=2023.1"]
docs = ["mkdocs>=1.5,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/thiagodefreitas/NetworkTime"
Documentation = "https://thiagodefreitas.github.io/NetworkTime/"
Changelog = "https://github.com/thiagodefreitas/NetworkTime/blob/master/CHANGELOG.md"
Issues = "https://github.com/thiagodefreitas/NetworkTime/issues"

[project.scripts]
ntpstats = "ntpstats.cli:main"

[project.entry-points.pytest11]
ntpstats = "ntpstats.testing"

[tool.setuptools.dynamic]
version = {attr = "ntpstats.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ntpstats" = ["py.typed"]
"ntpstats.web" = ["static/*", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ntpstats never calls its own deprecated names (tests that check the warning catch it explicitly)
filterwarnings = ["error::ntpstats.deprecation.NtpstatsDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["ntpstats"]

[tool.mypy]
# third-party modules without stubs (pyOpenSSL, matplotlib extras); ntpstats itself is checked fully
ignore_missing_imports = true
warn_unused_ignores = true
