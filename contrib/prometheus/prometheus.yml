# Minimal Prometheus configuration for the ntpstats exporter (used by contrib/docker-compose.yml).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/ntpstats-rules.yml
scrape_configs:
  - job_name: ntpstats
    static_configs:
      - targets: ["ntpstats:9123"]
